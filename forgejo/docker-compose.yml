# Forgejo, LAN-only HTTPS. All Forgejo configuration lives here as
# FORGEJO__* environment variables. See docs/forgejo-install-steps.md.
# LAN_IP comes from the .env file next to this compose file. The TLS
# certificate is created on the target by gen-cert.sh and lives in
# /srv/forgejo-certs, outside the data dir so dumps never contain the key.
services:
  forgejo:
    # Pinned stable release. Bump deliberately; never use :latest.
    image: codeberg.org/forgejo/forgejo:16.0.5
    container_name: forgejo
    restart: unless-stopped
    # Pin the instance name to the LAN address. On a user-defined network
    # the host resolver answers <hostname>.local synthetically with every
    # address of the machine, Docker bridge gateways included, so a
    # lookup can return 172.18.0.1 instead of the LAN address. The
    # hostname is set by the recipe (change 1), so the name is fixed.
    extra_hosts:
      - "forgejo.local:${LAN_IP}"
    ports:
      # Bound to the LAN IPv4 address only. The host also has a public
      # IPv6 address; binding 0.0.0.0 or [::] would expose Forgejo there.
      - "${LAN_IP}:443:3000"   # web UI, git-over-HTTP, API (HTTPS)
      - "${LAN_IP}:80:80"      # HTTP: redirects to HTTPS, serves nothing else
      - "${LAN_IP}:2222:2222"  # git over SSH (host sshd keeps port 22)
    environment:
      # Match the owner of the /srv/forgejo bind mount on the host.
      - USER_UID=1000
      - USER_GID=1000
      # Database: built-in SQLite inside the data volume.
      - FORGEJO__database__DB_TYPE=sqlite3
      # Web addressing. The canonical URL is the mDNS name, not the
      # address: Forgejo shows a mismatch warning to every client whose
      # Host header differs from ROOT_URL, and clients reach the
      # instance by name (Avahi on the LAN, extra_hosts and --add-host
      # in containers). The address still serves; it only shows the
      # warning. DOMAIN keeps generated SSH clone URLs on the name too.
      - FORGEJO__server__DOMAIN=forgejo.local
      - FORGEJO__server__ROOT_URL=https://forgejo.local/
      - FORGEJO__server__HTTP_PORT=3000
      # HTTPS with the self-signed certificate from gen-cert.sh. Absolute
      # paths: the default CERT_FILE/KEY_FILE are relative to CustomPath,
      # which is inside the data dir and therefore inside backups.
      - FORGEJO__server__PROTOCOL=https
      - FORGEJO__server__CERT_FILE=/etc/forgejo/certs/forgejo.crt
      - FORGEJO__server__KEY_FILE=/etc/forgejo/certs/forgejo.key
      # Plain HTTP listener that only redirects to ROOT_URL. It keeps
      # existing http:// clone URLs and bookmarks working.
      - FORGEJO__server__REDIRECT_OTHER_PORT=true
      - FORGEJO__server__PORT_TO_REDIRECT=80
      # Git-over-SSH: Forgejo runs its own SSH server. It must not bind
      # port 22 inside the container because the image's OpenSSH daemon
      # already uses it. Listen on 2222, published unchanged on the host.
      - FORGEJO__server__START_SSH_SERVER=true
      - FORGEJO__server__SSH_PORT=2222
      - FORGEJO__server__SSH_LISTEN_PORT=2222
      # Skip the web install wizard; config is fully defined here.
      - FORGEJO__security__INSTALL_LOCK=true
      # Global key for the data Forgejo encrypts at rest (two-factor
      # seeds, login source config). The instance ran with it empty, and
      # dumps blank it on purpose. Keeping the value in a file outside the
      # data dir means it is in no dump and not in this tracked file.
      # SECRET_KEY_URI and SECRET_KEY must not both have a value; Forgejo
      # exits at startup if they do.
      - FORGEJO__security__SECRET_KEY_URI=file:/etc/forgejo/secret_key
      # LAN instance: accounts are created by the admin via CLI.
      - FORGEJO__service__DISABLE_REGISTRATION=true
      # Actions: "uses: actions/checkout@v4" (no host) is fetched from
      # this instance, not from a public forge. The operator mirrors
      # every action used by workflows into repositories here (e.g. the
      # actions organization). Full URLs in uses: bypass this setting.
      # After changing it, clear the runner's cached actions: the cache
      # is not invalidated on its own.
      - FORGEJO__actions__DEFAULT_ACTIONS_URL=self
      # Pagination: 50 repositories per page when browsing. The listing is
      # one indexed SQL query plus a total count, so a larger page costs a
      # slightly bigger HTML response, not extra database work per page.
      - FORGEJO__ui__EXPLORE_PAGING_NUM=50
      # The dotted ini section [ui.user] is escaped as _0X2E_ in variable
      # names; environment-to-ini decodes it back to the section.
      - FORGEJO__ui_0X2E_user__REPO_PAGING_NUM=50
    volumes:
      - /srv/forgejo:/data
      - /srv/forgejo-certs:/etc/forgejo/certs:ro
      # Read-only single-file mount, so the key stays out of /data and out
      # of every dump. Host side: /opt/forgejo/secrets is mode 750 and the
      # file mode 640 root:1000, which is how the container's uid 1000
      # reads it. Losing this file makes already-encrypted values
      # unreadable, so it needs its own backup.
      - /opt/forgejo/secrets/secret_key:/etc/forgejo/secret_key:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

  # Forgejo Actions runner, same box (operator decision). Mitigations:
  # - The Docker socket is mounted for the runner daemon only. Job
  #   containers started by the runner never receive it.
  # - No privileged jobs, no docker-in-docker; container images are
  #   built with buildah inside jobs instead.
  # - Per-job CPU/memory limits and capacity 2 are set in
  #   /srv/forgejo-runner/config.yaml (see recipe).
  # - No published ports: the runner only dials the instance, over HTTPS.
  # - The instance certificate is added to the runner's trust store so
  #   verification stays on (`insecure: false` in the runner config).
  runner:
    # Pinned stable release. Bump deliberately; never use :latest.
    image: data.forgejo.org/forgejo/runner:13.1.0
    container_name: forgejo-runner
    restart: unless-stopped
    # The runner daemon must reach /var/run/docker.sock (root-owned).
    # Socket access is root-equivalent on the host either way, so the
    # container runs as root; job containers it starts are unprivileged.
    user: "0:0"
    depends_on:
      - forgejo
    # Same pin as the app service: without it the daemon resolves
    # forgejo.local to every address on the machine. The daemon dials the
    # address stored in .runner, so this only removes a wrong-answer
    # hazard; job containers get the pin from container.options instead.
    extra_hosts:
      - "forgejo.local:${LAN_IP}"
    volumes:
      - /srv/forgejo-runner:/data
      - /var/run/docker.sock:/var/run/docker.sock
      # Required: the runner's Go TLS client trusts the instance only
      # while this file is present in /etc/ssl/certs. Without the mount
      # the daemon exits with "x509: certificate signed by unknown
      # authority". Job containers get the same file plus
      # GIT_SSL_CAINFO from config.yaml.
      - /srv/forgejo-certs/forgejo.crt:/etc/ssl/certs/forgejo-lan.crt:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      # The runner downloads workflow actions with git (OpenSSL), which
      # reads a CA bundle file, not the loose file in /etc/ssl/certs.
      # Without this, action clones from the instance fail with "SSL
      # certificate OpenSSL verify result: self-signed certificate".
      # The bundle is rebuilt at every start (see command); the Go
      # daemon keeps using the /etc/ssl/certs directory.
      - GIT_SSL_CAINFO=/tmp/ca-bundle.crt
    # Build the merged bundle (public CAs + instance cert) before the
    # daemon starts; exec keeps forgejo-runner as PID 1 for signals.
    # The image is Alpine without the ca-certificates tooling, so
    # update-ca-certificates is not available.
    command: ["sh", "-c", "cat /etc/ssl/certs/ca-certificates.crt /etc/ssl/certs/forgejo-lan.crt > /tmp/ca-bundle.crt && exec forgejo-runner daemon --config /data/config.yaml"]
