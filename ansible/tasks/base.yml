---
# Base system: identity, packages, engine defaults, directories,
# LAN discovery. Tag: base.

- name: Require an IPv4 target address
  ansible.builtin.assert:
    that: lan_ip is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
    fail_msg: "lan_ip '{{ lan_ip }}' is not an IPv4 address; set it in hosts.yml"

- name: Require the LAN interface to exist on the target
  ansible.builtin.assert:
    that: lan_interface in ansible_facts['interfaces']
    fail_msg: >-
      interface '{{ lan_interface }}' is not on the target
      (found: {{ ansible_facts['interfaces'] | join(', ') }});
      set lan_interface in group_vars/all.yml

- name: Read the effective user id
  ansible.builtin.command: id -u
  changed_when: false
  check_mode: false
  register: effective_uid

- name: Require root access
  ansible.builtin.assert:
    that: effective_uid.stdout == '0'
    fail_msg: the playbook must connect as root

- name: Set the static hostname
  ansible.builtin.hostname:
    name: "{{ static_hostname }}"

- name: Make the hostname locally resolvable
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1\t{{ static_hostname }}"

- name: Apply pending upgrades
  ansible.builtin.apt:
    update_cache: true
    upgrade: safe

- name: Install engine and discovery packages
  ansible.builtin.apt:
    name:
      - podman
      - catatonit # kube play builds the local pause image with it
      - libnss-mdns
      - avahi-daemon

- name: Enable the Docker-compatible engine socket
  ansible.builtin.systemd:
    name: podman.socket
    enabled: true
    state: started

- name: Deploy engine defaults
  ansible.builtin.template:
    src: containers.conf.j2
    dest: /etc/containers/containers.conf
    mode: '0644'

- name: Ensure subuid ranges for the engine
  ansible.builtin.lineinfile:
    path: /etc/subuid
    regexp: '^{{ item }}:'
    line: "{{ item }}:100000:4294867296"
  loop: [root, containers]

- name: Ensure subgid ranges for the engine
  ansible.builtin.lineinfile:
    path: /etc/subgid
    regexp: '^{{ item }}:'
    line: "{{ item }}:100000:4294867296"
  loop: [root, containers]

- name: Create the data directory owned by the container user
  ansible.builtin.file:
    path: "{{ data_dir }}"
    state: directory
    owner: "{{ container_user }}"
    group: "{{ container_user }}"
    mode: '0755'

- name: Create deployment, runner and backup directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ opt_dir }}/kube"
    - "{{ runner_dir }}"
    - "{{ backup_dir }}"

- name: Restrict Avahi to the LAN interface
  ansible.builtin.lineinfile:
    path: /etc/avahi/avahi-daemon.conf
    regexp: '^allow-interfaces='
    line: "allow-interfaces={{ lan_interface }}"
    insertafter: '^\[server\]'
  register: avahi_conf

- name: Read the host answer for the LAN name
  ansible.builtin.command: getent ahostsv4 {{ lan_name }}
  changed_when: false
  check_mode: false
  register: mdns_answer

- name: Assert the LAN name resolves to the LAN address on the host
  ansible.builtin.assert:
    that: mdns_answer.stdout.split('\n')[0].split()[0] == lan_ip
    fail_msg: >-
      {{ lan_name }} does not resolve to {{ lan_ip }} on the target
      (got: {{ mdns_answer.stdout_lines[0] | default('nothing') }});
      check avahi-daemon and the allow-interfaces pin

# Handlers are unavailable with import_tasks; conditional restart instead.
- name: Restart Avahi after an interface-pin change  # noqa: no-handler
  ansible.builtin.systemd:
    name: avahi-daemon
    state: restarted
  when: avahi_conf.changed
