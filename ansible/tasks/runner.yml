---
# Actions runner: registration state and job configuration. Tag: runner.
# Registration needs admin credentials and only runs when the runner is
# not yet registered; a running instance keeps its registration.

- name: Read the runner registration state
  ansible.builtin.stat:
    path: "{{ runner_dir }}/.runner"
  register: runner_reg

- name: Require admin credentials when the runner is not registered
  ansible.builtin.assert:
    that: forgejo_admin_password is defined
    fail_msg: >-
      {{ runner_dir }}/.runner is missing, so the runner must be
      registered. Re-run with forgejo_admin_user and
      forgejo_admin_password set (see hosts.yml.example).
    success_msg: runner is registered
  when: not runner_reg.stat.exists

- name: Fetch the runner registration token on the target  # noqa: command-instead-of-module
  ansible.builtin.command: >-
    curl -s --cacert {{ cert_file }}
    -u '{{ forgejo_admin_user }}:{{ forgejo_admin_password }}'
    https://{{ lan_ip }}/api/v1/admin/runners/registration-token
  changed_when: false
  no_log: true
  when: not runner_reg.stat.exists
  register: reg_response

- name: Register the runner (first time only)
  # The registration container dials the instance by its canonical
  # name over HTTPS, so it needs the name pin (--add-host: nothing
  # serves .local inside a container network) and the instance
  # certificate in /etc/ssl/certs (the runner's Go client). Without
  # the pin the register call hangs in name resolution, so the whole
  # command carries a hard timeout. --userns=host and --user 0: the
  # global containers.conf userns=auto remaps the container's root off
  # host uid 0 (kube play ignores that setting, plain podman run does
  # not), so without the flag neither generate-config nor register can
  # write into the root-owned runner dir.
  ansible.builtin.shell: >
    set -e;
    podman run --rm --user 0 --userns=host -v {{ runner_dir }}:/data {{ runner_image }}
    forgejo-runner generate-config > {{ runner_dir }}/config.yaml;
    timeout 300 podman run --rm --user 0 --userns=host
    -v {{ runner_dir }}:/data
    -v {{ cert_file }}:/etc/ssl/certs/forgejo-register.crt:ro
    --add-host={{ lan_name }}:{{ lan_ip }}
    {{ runner_image }}
    forgejo-runner register --config /data/config.yaml
    --instance https://{{ lan_name }}/ --token '{{ reg_token }}'
    --labels '{{ runner_job_label }}' --no-interactive
  changed_when: true
  vars:
    reg_token: "{{ (reg_response.stdout | from_json).token }}"
  no_log: true
  when: not runner_reg.stat.exists

- name: Deploy the runner job configuration
  ansible.builtin.template:
    src: runner-config.yaml.j2
    dest: "{{ runner_dir }}/config.yaml"
    mode: '0644'
  register: runner_config

- name: Start and enable the runner pod
  ansible.builtin.systemd:
    name: podman-kube@opt-forgejo-kube-runner.yaml.service
    enabled: true
    state: started

- name: Restart the runner pod after registration or a config change  # noqa: no-handler
  # A fresh install started the pod before registration existed, so
  # the daemon exited; the restart picks up the registration and the
  # deployed config together. On a converged host neither condition
  # fires and the pod is left alone.
  ansible.builtin.systemd:
    name: podman-kube@opt-forgejo-kube-runner.yaml.service
    state: restarted
  when: not runner_reg.stat.exists or runner_config.changed

- name: Read the name pin inside the runner container
  ansible.builtin.command: "podman exec forgejo-runner-forgejo-runner getent ahostsv4 {{ lan_name }}"
  changed_when: false
  check_mode: false
  register: runner_name_pin

- name: Assert the runner container name pin answers with the LAN address alone
  ansible.builtin.assert:
    that: runner_name_pin.stdout.split('\n')[0].split()[0] == lan_ip
    fail_msg: >-
      {{ lan_name }} does not resolve to {{ lan_ip }} inside the runner
      container (got: {{ runner_name_pin.stdout_lines[0] | default('nothing') }});
      the pod hostAliases pin is wrong or the pod needs a restart

- name: Read the runner job configuration for verification
  ansible.builtin.command: >-
    grep -cE '^  capacity: {{ runner_capacity }}$|add-host={{ lan_name }}:|NODE_EXTRA_CA_CERTS:|^  valid_volumes:|^  env_file: ""$'
    {{ runner_dir }}/config.yaml
  changed_when: false
  check_mode: false
  register: runner_cfg_check

- name: Assert the job configuration carries every mitigation
  ansible.builtin.assert:
    that: runner_cfg_check.stdout == '5'
    fail_msg: >-
      {{ runner_dir }}/config.yaml is missing one of the required
      settings (capacity, name pin, CA variables, valid_volumes,
      env_file off); the template did not apply

- name: Assert the sample job environment entries are gone
  ansible.builtin.command: "grep -q A_TEST_ENV_NAME {{ runner_dir }}/config.yaml"
  changed_when: false
  check_mode: false
  failed_when: runner_sample_env.rc not in [0, 1]
  register: runner_sample_env

- name: Fail when sample job environment entries remain
  ansible.builtin.assert:
    that: runner_sample_env.rc == 1
    fail_msg: >-
      generate-config sample entries (A_TEST_ENV_NAME_*) are still in
      {{ runner_dir }}/config.yaml; the runner passes them to every job
