# Ansible settings for this deployment. Run playbooks from this
# directory: ansible-playbook site.yml
[defaults]
inventory = hosts.yml
# interpreter_python = /usr/bin/python3
retry_files_enabled = False

[ssh_connection]
pipelining = True
# First contact with a fresh target pins the key instead of prompting;
# later mismatches still fail.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
